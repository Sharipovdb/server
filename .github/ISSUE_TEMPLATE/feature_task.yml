name: Feature Request
description: Suggest a new feature or enhancement.
title: "[Product] "
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Replace `[Product]` in the title with the app name: Articles Hub, Machinery Yard, or Ads Hub.
        Set **Milestone** and **Iteration** from the sidebar after submitting.

  - type: textarea
    id: description
    attributes:
      label: What do you want, and why?
      description: The feature and the problem it solves.
      placeholder: |
        As a [user], I want [goal] so that [benefit].
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Acceptance criteria
      description: Optional. What must be true for this to be done?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Optional. Screenshots, references, links.
    validations:
      required: false
